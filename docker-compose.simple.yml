
version: '3.8'

services:
  # PostgreSQL database for Nextcloud
  db:
    image: postgres:15
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - nextcloud_network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud_network

  # Nextcloud
  nextcloud:
    image: nextcloud:27-apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud_password
      REDIS_HOST: redis
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 172.19.0.0/16
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin_password
    volumes:
      - nextcloud_data:/var/www/html
      - nextcloud_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
    depends_on:
      - db
      - redis
    networks:
      - nextcloud_network

  # Collabora Online (LibreOffice web interface)
  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    ports:
      - "9980:9980"
    environment:
      - domain=nextcloud\.localhost
      - username=admin
      - password=collabora_password
      - dictionaries=en_US
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false
    cap_add:
      - MKNOD
    networks:
      - nextcloud_network

volumes:
  db_data:
  nextcloud_data:
  nextcloud_apps:
  nextcloud_config:

networks:
  nextcloud_network:
    driver: bridge 