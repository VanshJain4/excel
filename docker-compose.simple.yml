version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud_password
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - nextcloud_network

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - nextcloud_network

  nextcloud:
    image: nextcloud:27-apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud_password
      REDIS_HOST: redis
      # Keep trusted domains to the names you'll actually use locally
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin_password
      # optional, keeps URLs clean if proxies appear later
      OVERWRITEPROTOCOL: http
    volumes:
      - nextcloud_data:/var/www/html
      - nextcloud_apps:/var/www/html/custom_apps
      - nextcloud_config:/var/www/html/config
    depends_on:
      - db
      - redis
    networks:
      - nextcloud_network

  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    ports:
      - "9980:9980"
    environment:
      # VERY IMPORTANT: allow the host you use to open Nextcloud in your browser
      # If you open http://localhost:8080 add localhost; if you also use 127.0.0.1 add that too.
      - domain=localhost|127\.0\.0\.1|nextcloud
      # (optional) basic auth for admin console
      - username=admin
      - password=collabora_password
      - dictionaries=en_US
      # use HTTP for local; no self-signed TLS hassles
      - extra_params=--o:ssl.enable=false --o:welcome.enable=false
    cap_add:
      - MKNOD
    networks:
      - nextcloud_network

volumes:
  db_data:
  nextcloud_data:
  nextcloud_apps:
  nextcloud_config:

networks:
  nextcloud_network:
    driver: bridge
