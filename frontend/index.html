<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Cursor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Excel Cursor</h1>
            <p class="text-gray-600">AI-powered assistant for Excel</p>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- File Upload Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-semibold mb-4">Upload Excel File</h2>
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                    <input type="file" id="excelFile" accept=".xlsx,.xls" class="hidden">
                    <label for="excelFile" class="cursor-pointer">
                        <div class="text-gray-500 mb-2">
                            <svg class="mx-auto h-12 w-12" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                        <span class="text-blue-600 hover:text-blue-800">Choose an Excel file</span>
                        <span class="text-gray-500"> or drag and drop</span>
                    </label>
                </div>
                <div id="fileInfo" class="mt-4 hidden">
                    <p class="text-sm text-gray-600">Selected file: <span id="fileName"></span></p>
                    <button id="uploadBtn" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        Upload and Analyze
                    </button>
                </div>
                <div id="uploadResult" class="mt-4"></div>
            </div>

            <!-- AI Assistant Section -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-2xl font-semibold mb-4">AI Assistant</h2>
                
                <!-- Formula Suggestion -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Describe what you want to calculate:
                    </label>
                    <input type="text" id="formulaDescription" 
                           placeholder="e.g., sum all sales in column A" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="suggestFormulaBtn" class="mt-2 bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                        Get Formula
                    </button>
                    <div id="formulaResult" class="mt-2 p-3 bg-gray-100 rounded hidden">
                        <p class="text-sm font-medium">Suggested Formula:</p>
                        <code id="suggestedFormula" class="text-blue-600 font-mono"></code>
                    </div>
                </div>

                <!-- Cell Analysis -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Analyze a cell value:
                    </label>
                    <input type="text" id="cellValue" 
                           placeholder="Enter cell value or formula" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="analyzeCellBtn" class="mt-2 bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                        Analyze
                    </button>
                    <div id="analysisResult" class="mt-2 p-3 bg-gray-100 rounded hidden">
                        <p class="text-sm font-medium">Analysis:</p>
                        <p id="cellAnalysis" class="text-sm text-gray-700"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Section -->
        <div class="mt-8 bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-semibold mb-4">API Status</h2>
            <div id="apiStatus" class="flex items-center">
                <div class="w-3 h-3 bg-gray-400 rounded-full mr-2"></div>
                <span class="text-gray-600">Checking API status...</span>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // Check API status
        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                const statusEl = document.getElementById('apiStatus');
                if (response.ok) {
                    statusEl.innerHTML = `
                        <div class="w-3 h-3 bg-green-500 rounded-full mr-2"></div>
                        <span class="text-green-600">API is running</span>
                    `;
                } else {
                    throw new Error('API not responding');
                }
            } catch (error) {
                const statusEl = document.getElementById('apiStatus');
                statusEl.innerHTML = `
                    <div class="w-3 h-3 bg-red-500 rounded-full mr-2"></div>
                    <span class="text-red-600">API not available</span>
                `;
            }
        }

        // File upload handling
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileInfo').classList.remove('hidden');
            }
        });

        document.getElementById('uploadBtn').addEventListener('click', async function() {
            const fileInput = document.getElementById('excelFile');
            const file = fileInput.files[0];
            
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/upload-excel`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                const resultDiv = document.getElementById('uploadResult');
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="p-4 bg-green-100 border border-green-400 rounded">
                            <p class="text-green-700">✓ File uploaded successfully!</p>
                            <p class="text-sm text-green-600 mt-1">Sheets: ${result.data.sheets.join(', ')}</p>
                            <p class="text-sm text-green-600">Dimensions: ${result.data.data.dimensions}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="p-4 bg-red-100 border border-red-400 rounded">
                            <p class="text-red-700">✗ Error: ${result.detail}</p>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('uploadResult').innerHTML = `
                    <div class="p-4 bg-red-100 border border-red-400 rounded">
                        <p class="text-red-700">✗ Error: ${error.message}</p>
                    </div>
                `;
            }
        });

        // Formula suggestion
        document.getElementById('suggestFormulaBtn').addEventListener('click', async function() {
            const description = document.getElementById('formulaDescription').value;
            if (!description) return;

            try {
                const response = await fetch(`${API_BASE}/suggest-formula`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        description: description,
                        context: {}
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('suggestedFormula').textContent = result.formula;
                    document.getElementById('formulaResult').classList.remove('hidden');
                } else {
                    alert('Error: ' + result.detail);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Cell analysis
        document.getElementById('analyzeCellBtn').addEventListener('click', async function() {
            const cellValue = document.getElementById('cellValue').value;
            if (!cellValue) return;

            try {
                const response = await fetch(`${API_BASE}/analyze-cell`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cell_value: cellValue,
                        context: {}
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('cellAnalysis').textContent = result.suggestions;
                    document.getElementById('analysisResult').classList.remove('hidden');
                } else {
                    alert('Error: ' + result.detail);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Initialize
        checkApiStatus();
    </script>
</body>
</html>
