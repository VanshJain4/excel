version: '3.8'

services:
  # Frontend (React App)
  frontend:
    build:
      context: ./auth-interface
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - REACT_APP_WOPI_SERVER_URL=http://localhost:3002
    depends_on:
      - wopi-server
    networks:
      - skopeo-network

  # WOPI Server
  wopi-server:
    build:
      context: ./gpt
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    networks:
      - skopeo-network

networks:
  skopeo-network:
    driver: bridge
