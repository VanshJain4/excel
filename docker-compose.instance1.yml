version: '3.8'

services:
  # Frontend (React App)
  frontend:
    build:
      context: ./auth-interface
      dockerfile: Dockerfile
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - REACT_APP_WOPI_SERVER_URL=${WOPI_SERVER_URL}
    depends_on:
      - wopi-server
    networks:
      - skopeo-network

  # WOPI Server
  wopi-server:
    build:
      context: ./gpt
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - PORT=${WOPI_SERVER_PORT}
    networks:
      - skopeo-network

networks:
  skopeo-network:
    driver: bridge
