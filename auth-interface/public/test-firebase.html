<!DOCTYPE html>
<html>
<head>
    <title>Firebase Test</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyAV8EITshJJO_-NGkBOMiU3gIIMs0vZirQ",
            authDomain: "skopeo-ai.firebaseapp.com",
            projectId: "skopeo-ai",
            storageBucket: "skopeo-ai.firebasestorage.app",
            messagingSenderId: "295265049654",
            appId: "1:295265049654:web:486856ccde50928efe8c97",
            measurementId: "G-S7Y1FDBM6L"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        window.testLogin = async () => {
            try {
                console.log('Testing Firebase login...');
                const result = await signInWithPopup(auth, provider);
                console.log('Login successful:', result.user);
                document.getElementById('status').innerHTML = '✅ Login successful! User: ' + result.user.email;
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('status').innerHTML = '❌ Login failed: ' + error.message;
            }
        };
        
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('status').innerHTML = '✅ User logged in: ' + user.email;
            } else {
                document.getElementById('status').innerHTML = 'No user logged in';
            }
        });
    </script>
</head>
<body>
    <h1>Firebase Authentication Test</h1>
    <button onclick="testLogin()">Test Google Login</button>
    <div id="status">Click the button to test login</div>
</body>
</html>
