<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LibreOffice Calc with AI Assistant (Local)</title>

  <!-- Injected at runtime by server/index.js in dev (optional).
       If not injected, getEnv() will fall back to localhost defaults. -->

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, connectAuthEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, doc, updateDoc, serverTimestamp, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
    import { getStorage, connectStorageEmulator } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';

    // ---- helper to read "injected" env or fallback ----
    window.getEnv = function(name, fallback) {
      return (window.__ENV && window.__ENV[name]) || fallback;
    };

    // Firebase configuration (keep your real project config)
    const firebaseConfig = {
      apiKey: "AIzaSyAV8EITshJJO_-NGkBOMiU3gIIMs0vZirQ",
      authDomain: "skopeo-ai.firebaseapp.com",
      projectId: "skopeo-ai",
      storageBucket: "skopeo-ai.firebasestorage.app",
      messagingSenderId: "295265049654",
      appId: "1:295265049654:web:486856ccde50928efe8c97",
      measurementId: "G-S7Y1FDBM6L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Expose for saveFile()
    window.auth = auth;
    window.db = db;
    window.doc = doc;
    window.updateDoc = updateDoc;
    window.serverTimestamp = serverTimestamp;

    // Emulators when local
    const useEmulators =
      (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ||
      window.getEnv('REACT_APP_USE_EMULATORS', 'false') === 'true';

    if (useEmulators) {
      connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
      connectFirestoreEmulator(db, '127.0.0.1', 8080);
      connectStorageEmulator(storage, '127.0.0.1', 9199);
    }

    // Mock user from URL (fallback to auth state)
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const userEmail = urlParams.get('userEmail');

    if (userId && userEmail) {
      window.currentUser = {
        uid: userId,
        email: userEmail,
        displayName: (userEmail.split('@')[0] || 'User')
      };
      console.log('User info from URL:', window.currentUser);
    }

    auth.onAuthStateChanged((user) => {
      if (!window.currentUser) window.currentUser = user;
    });
  </script>

  <style>
    html, body { margin:0; padding:0; height:100%; font-family: Arial, sans-serif; overflow:hidden; }
    .container { display:flex; height:100vh; }
    .collabora-container { flex:1; position:relative; transition: margin-right .3s ease; }
    .collabora-container.chat-hidden { margin-right:0; }
    .collabora-iframe { width:100%; height:100%; border:none; }
    .chat-sidebar { width:350px !important; background:#f8f9fa; color:#333; display:flex; flex-direction:column; border-left:1px solid #0f6803; flex-shrink:0; }
    .chat-sidebar.closed { display:none; }
    .save-button { position:fixed; top:5px; left:45px; z-index:1000; background:#0f6803; color:#fff; border:none; border-radius:3px; padding:8px; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.2); width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
    .save-button:disabled { background:#6c757d; }
    .spinner { display:none; width:16px; height:16px; border:2px solid #fff; border-top:2px solid transparent; border-radius:50%; animation:spin 1s linear infinite; }
    .save-button.saving .spinner { display:inline-block; }
    .save-button.saving .save-text { display:none; }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    .chat-header { background:#0f6803; color:#fff; padding:15px; text-align:center; border-bottom:1px solid #0a4d02; position:relative; }
    .chat-controls { position:absolute; top:10px; right:10px; display:flex; gap:5px; }
    .control-button { background:#f8f9fa; color:#333; border:1px solid #0f6803; border-radius:3px; padding:3px 6px; cursor:pointer; font-size:10px; }
    .chat-messages { flex:1; padding:15px; overflow-y:auto; background:#f8f9fa; }
    .message { margin-bottom:15px; padding:10px; border-radius:8px; max-width:80%; word-wrap:break-word; }
    .message.user { background:#0f6803; color:#fff; margin-left:auto; text-align:right; }
    .message.ai { background:#e8f0e3; color:#333; border:1px solid #0f6803; margin-right:auto; }
    .message-time { font-size:11px; opacity:.7; margin-top:5px; }
    .chat-input-container { padding:15px; background:#f8f9fa; border-top:1px solid #0f6803; }
    .chat-input { width:100%; padding:10px; border:1px solid #0f6803; border-radius:5px; }
    .send-button { background:#0f6803; color:#fff; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; margin-top:10px; width:100%; }
    .loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#2c3e50; font-size:18px; }
    .chat-reopen { position:fixed; top:20px; right:20px; background:#0f6803; color:#fff; border:none; border-radius:5px; padding:10px 15px; cursor:pointer; font-size:14px; z-index:1000; }
    .chat-reopen.hidden { display:none; }
  </style>
</head>
<body>
  <!-- Save -->
  <button class="save-button" id="save-button" onclick="saveFile()" title="Save File">
    <div class="spinner"></div>
    <span class="save-text">💾</span>
  </button>

  <div class="container">
    <div class="collabora-container" id="collabora-container">
      <div class="loading" id="loading">Loading LibreOffice Calc...</div>
      <iframe class="collabora-iframe" id="collabora-iframe" onload="hideLoading()"></iframe>
    </div>

    <div class="chat-sidebar" id="chat-sidebar">
      <div class="chat-header">
        <h3>🤖 AI Assistant</h3>
        <p style="margin:5px 0; font-size:12px; opacity:.8;">Chat with AI about your spreadsheet</p>
        <div class="chat-controls">
          <button class="control-button" onclick="closeChat()">Close</button>
          <button class="control-button" onclick="resetChatSize()">Reset</button>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="message ai">
          <div>Hello! I can help with your Calc sheet. Try typing below.</div>
          <div class="message-time">Just now</div>
        </div>
      </div>

      <div class="chat-input-container">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type your message..." maxlength="500" />
        <button class="send-button" id="send-button" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <button class="chat-reopen hidden" id="reopen-button" onclick="reopenChat()">🤖 Reopen AI Chat</button>

  <script>
    function hideLoading(){ document.getElementById('loading').style.display='none'; }

    function getFileIdFromUrl(){ return new URLSearchParams(location.search).get('fileId') || '123'; }
    function getUserIdFromUrl(){ return new URLSearchParams(location.search).get('userId') || 'anonymous'; }
    function getUserEmailFromUrl(){ return new URLSearchParams(location.search).get('userEmail') || 'user@example.com'; }
    function getUserNameFromUrl(){ return new URLSearchParams(location.search).get('userName') || 'User'; }

    function updateIframeSrc(){
      const fileId = getFileIdFromUrl();
      const userId = getUserIdFromUrl();
      const userEmail = getUserEmailFromUrl();
      const userName = getUserNameFromUrl();

      const codeBase = window.getEnv('REACT_APP_CODE_BASE_URL', 'http://localhost:9980');
      const wopiBase = window.getEnv('REACT_APP_WOPI_SERVER_URL','http://localhost:3002');
      const wopiSrc  = `${wopiBase}/wopi/files/${fileId}?userId=${encodeURIComponent(userId)}&userEmail=${encodeURIComponent(userEmail)}&userName=${encodeURIComponent(userName)}`;

      const url = `${codeBase}/browser/dist/cool.html?WOPISrc=${encodeURIComponent(wopiSrc)}&permission=edit&nouserfollowing=true&nouserlist=true&nouserinfo=true&nouseravatar=true`;
      console.log('Loading Collabora (local) with URL:', url);

      document.getElementById('collabora-iframe').src = url;
    }
    updateIframeSrc();

    async function saveFile(){
      const saveButton = document.getElementById('save-button');
      const fileId = getFileIdFromUrl();
      if (fileId === 'empty'){ alert('Upload a file first.'); return; }
      if (!window.currentUser){ alert('Please log in first.'); return; }

      try{
        saveButton.classList.add('saving'); saveButton.disabled = true;

        const iframe = document.getElementById('collabora-iframe');
        iframe.contentWindow.postMessage({ type:'save', action:'save' }, '*');

        await new Promise(r => setTimeout(r, 3000)); // give CODE time to persist to WOPI

        const wopiBase = window.getEnv('REACT_APP_WOPI_SERVER_URL','http://localhost:3002');
        const res = await fetch(`${wopiBase}/wopi/files/${fileId}/contents?nocache=${Date.now()}`);
        if(!res.ok) throw new Error('Failed to get current file content');
        const blob = await res.blob();

        const base64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });

        const { db, doc, updateDoc, serverTimestamp } = window;
        const fileDoc = doc(db, 'files', fileId);
        await updateDoc(fileDoc, { fileContent: base64, fileSize: blob.size, updatedAt: serverTimestamp() });

        showToast('File saved to Firebase (local)!');
      }catch(err){
        console.error(err);
        showToast('Save failed: ' + err.message, 'error');
      }finally{
        saveButton.classList.remove('saving'); saveButton.disabled = false;
      }
    }

    function showToast(msg, type='success'){
      const div = document.createElement('div');
      div.style.cssText = `position:fixed; top:80px; left:20px; z-index:1001; padding:12px 20px; border-radius:5px; color:white; font-weight:bold; background:${type==='error'?'#dc3545':'#28a745'}; box-shadow:0 2px 8px rgba(0,0,0,.2)`;
      div.textContent = msg; document.body.appendChild(div);
      setTimeout(()=>{ div.style.opacity='0'; setTimeout(()=>div.remove(),300); }, 2500);
    }

    // very light chat mock
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');

    function addMessage(text, isUser=false){
      const box = document.createElement('div');
      box.className = `message ${isUser?'user':'ai'}`;
      box.innerHTML = `<div>${text}</div><div class="message-time">${new Date().toLocaleTimeString()}</div>`;
      chatMessages.appendChild(box);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    function sendMessage(){
      const msg = chatInput.value.trim(); if(!msg) return;
      addMessage(msg, true); chatInput.value=''; sendButton.disabled=true; sendButton.textContent='Thinking...';
      setTimeout(()=>{ addMessage(`You said: "${msg}"`); sendButton.disabled=false; sendButton.textContent='Send'; }, 700);
    }
    function closeChat(){ document.querySelector('.chat-sidebar').classList.add('closed'); document.getElementById('reopen-button').classList.remove('hidden'); }
    function reopenChat(){ document.querySelector('.chat-sidebar').classList.remove('closed'); document.getElementById('reopen-button').classList.add('hidden'); }
    function resetChatSize(){ document.querySelector('.chat-sidebar').style.width='350px'; }
    chatInput.addEventListener('keypress', e => { if(e.key==='Enter' && !sendButton.disabled) sendMessage(); });
    chatInput.focus();
  </script>
</body>
</html>
